<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="ledger_content_master" data-pptx-master-name="Board Ledger — Content" data-pptx-layout="ledger_exhibit_rail" data-pptx-layout-name="Exhibit + Takeaway Rail">
  <!-- Board Ledger — 08 2x2 prioritisation matrix: quadrant labels, sized bubbles, one highlighted (sample positions) -->
  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
