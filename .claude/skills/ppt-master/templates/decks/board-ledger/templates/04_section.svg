<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="ledger_title_master" data-pptx-master-name="Board Ledger — Title" data-pptx-layout="ledger_section" data-pptx-layout-name="Section">
  <!-- Board Ledger — 04 Section: large chapter number, chapter tracker strip -->
