<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="rn-master" data-pptx-master-name="Research Note" data-pptx-layout="rn_cover" data-pptx-layout-name="Cover (Key Call)">
  <!-- Research Note — 01 Cover: report header band, headline block, key-figure row + navy key-call box -->
  <rect id="master-bg" width="1280" height="720" fill="#F5F3EF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="master-top-rule" x="48" y="44" width="1184" height="3" fill="#0B2545" data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="master-footer-rule" x1="48" y1="672" x2="1232" y2="672" stroke="#B8B8B8" stroke-width="1" data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="layout-cover-divider" x1="48" y1="324" x2="1232" y2="324" stroke="#1A1A1A" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-key-call-box" x="872" y="352" width="360" height="280" fill="#0B2545" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="report-header">
    <text x="48" y="33" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#707070" xml:space="preserve"><tspan font-weight="700" fill="#0B2545">{{BRAND_MARK}}</tspan><tspan fill="#B8B8B8">  |  </tspan><tspan>{{REPORT_TYPE}}</tspan></text>
    <text x="1232" y="33" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#707070" xml:space="preserve"><tspan>{{DATE}}</tspan><tspan fill="#B8B8B8">  ·  </tspan><tspan>{{CLASSIFICATION}}</tspan></text>
  </g>

  <g id="cover-sector">
    <text x="48" y="124" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#0B2545">{{SECTOR}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="48 140 1184 64">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="48" y="186" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="48" letter-spacing="-0.8" fill="#1A1A1A">{{TITLE}}</text>
  </g>

  <g id="subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-placeholder-idx="1" data-pptx-placeholder-bounds="48 210 1184 36">
    <text id="subtitle-carrier" data-pptx-placeholder-carrier="true" x="48" y="236" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.2" fill="#3A3A3A">{{SUBTITLE}}</text>
  </g>

  <g id="cover-author">
    <text x="48" y="290" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A" xml:space="preserve"><tspan font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">Analyst  </tspan><tspan>{{AUTHOR}}</tspan></text>
  </g>

  <g id="key-figures">
    <text x="48" y="386" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#0B2545">핵심 지표</text>
    <text x="832" y="386" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#707070">Key Figures</text>
    <line x1="48" y1="400" x2="832" y2="400" stroke="#B8B8B8" stroke-width="1"/>
    <line x1="309" y1="416" x2="309" y2="616" stroke="#DCDCDC" stroke-width="1"/>
    <line x1="571" y1="416" x2="571" y2="616" stroke="#DCDCDC" stroke-width="1"/>
    <text x="48" y="492" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="40" letter-spacing="-0.6" fill="#0B2545">{{STAT_1}}</text>
    <text x="48" y="528" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#3A3A3A">{{STAT_1_LABEL}}</text>
    <text x="48" y="556" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">{{STAT_1_NOTE}}</text>
    <text x="333" y="492" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="40" letter-spacing="-0.6" fill="#0B2545">{{STAT_2}}</text>
    <text x="333" y="528" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#3A3A3A">{{STAT_2_LABEL}}</text>
    <text x="333" y="556" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">{{STAT_2_NOTE}}</text>
    <text x="595" y="492" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="40" letter-spacing="-0.6" fill="#0B2545">{{STAT_3}}</text>
    <text x="595" y="528" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#3A3A3A">{{STAT_3_LABEL}}</text>
    <text x="595" y="556" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">{{STAT_3_NOTE}}</text>
    <line x1="48" y1="632" x2="832" y2="632" stroke="#B8B8B8" stroke-width="1"/>
  </g>

  <g id="key-call">
    <text x="900" y="386" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#E3E8EF">투자의견</text>
    <text x="900" y="446" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="40" letter-spacing="-0.6" fill="#FFFFFF">{{KEY_CALL}}</text>
    <line x1="900" y1="472" x2="1204" y2="472" stroke="#707070" stroke-width="1"/>
    <text x="900" y="508" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF">{{KEY_CALL_NOTE}}</text>
    <text x="900" y="608" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#E3E8EF">{{KEY_CALL_BASIS}}</text>
  </g>

  <g id="disclaimer-slot" data-pptx-placeholder="footer" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="48 680 960 24">
    <text id="disclaimer-carrier" data-pptx-placeholder-carrier="true" x="48" y="695" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" fill="#707070">{{DISCLAIMER}}</text>
  </g>
</svg>
