    <text x="480" y="256" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">확률</text>
    <text x="800" y="262" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="28" fill="#0B2545">{{BASE_PROB}}</text>
    <rect x="480" y="278" width="320" height="6" fill="#DCDCDC"/>
    <rect x="480" y="278" width="160" height="6" fill="#0B2545"/>
    <line x1="480" y1="306" x2="800" y2="306" stroke="#DCDCDC" stroke-width="1"/>
    <text x="480" y="336" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">핵심 가정</text>
    <text x="480" y="372" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#3A3A3A"><tspan fill="#0B2545">▪</tspan><tspan> {{BASE_ASSUMPTION_1}}</tspan></text>
    <text x="480" y="406" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#3A3A3A"><tspan fill="#0B2545">▪</tspan><tspan> {{BASE_ASSUMPTION_2}}</tspan></text>
    <text x="480" y="440" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#3A3A3A"><tspan fill="#0B2545">▪</tspan><tspan> {{BASE_ASSUMPTION_3}}</tspan></text>
    <line x1="480" y1="470" x2="800" y2="470" stroke="#DCDCDC" stroke-width="1"/>
    <text x="480" y="500" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">{{OUTCOME_LABEL}}</text>
    <text x="480" y="548" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="36" letter-spacing="-0.5" fill="#0B2545">{{BASE_VALUE}}</text>
    <text x="480" y="580" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#0B2545">{{BASE_DELTA}}</text>
  </g>

  <g id="scenario-bull">
    <text x="888" y="200" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="22" fill="#1A1A1A" xml:space="preserve"><tspan>Bull</tspan><tspan font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-weight="400" font-size="15" fill="#3A3A3A">  낙관</tspan></text>
    <text x="888" y="256" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">확률</text>
    <text x="1208" y="262" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="28" fill="#1A1A1A">{{BULL_PROB}}</text>
    <rect x="888" y="278" width="320" height="6" fill="#DCDCDC"/>
    <rect x="888" y="278" width="80" height="6" fill="#0B2545"/>
    <line x1="888" y1="306" x2="1208" y2="306" stroke="#DCDCDC" stroke-width="1"/>
    <text x="888" y="336" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">핵심 가정</text>
    <text x="888" y="372" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#3A3A3A"><tspan fill="#0B2545">▪</tspan><tspan> {{BULL_ASSUMPTION_1}}</tspan></text>
    <text x="888" y="406" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#3A3A3A"><tspan fill="#0B2545">▪</tspan><tspan> {{BULL_ASSUMPTION_2}}</tspan></text>
    <text x="888" y="440" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#3A3A3A"><tspan fill="#0B2545">▪</tspan><tspan> {{BULL_ASSUMPTION_3}}</tspan></text>
    <line x1="888" y1="470" x2="1208" y2="470" stroke="#DCDCDC" stroke-width="1"/>
    <text x="888" y="500" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">{{OUTCOME_LABEL}}</text>
    <text x="888" y="548" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="36" letter-spacing="-0.5" fill="#1A1A1A">{{BULL_VALUE}}</text>
    <text x="888" y="580" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#3A3A3A">{{BULL_DELTA}}</text>
  </g>

  <g id="scenario-summary">
    <text x="48" y="636" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#707070">주: {{SCENARIO_NOTE}}</text>
    <text x="1232" y="638" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="20" fill="#0B2545" xml:space="preserve"><tspan font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-weight="400" font-size="13" fill="#707070">확률가중 기대값  </tspan><tspan>{{WEIGHTED_VALUE}}</tspan></text>
  </g>

  <g id="disclaimer-slot" data-pptx-placeholder="footer" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="48 680 960 24">
    <text id="disclaimer-carrier" data-pptx-placeholder-carrier="true" x="48" y="695" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" fill="#707070">{{DISCLAIMER}}</text>
  </g>

  <g id="page-number-slot" data-pptx-placeholder="slide-number" data-pptx-placeholder-idx="3" data-pptx-placeholder-bounds="1112 680 120 24">
    <text id="page-number-carrier" data-pptx-placeholder-carrier="true" x="1232" y="695" text-anchor="end" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#1A1A1A">{{PAGE_NUM}}</text>
  </g>
</svg>
