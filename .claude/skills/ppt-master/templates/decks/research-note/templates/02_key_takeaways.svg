<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="rn-master" data-pptx-master-name="Research Note" data-pptx-layout="rn_takeaways" data-pptx-layout-name="Key Takeaways (Sidebar)">
  <!-- Research Note — 02 Key takeaways: navy-tint 1/3 summary sidebar + 2/3 key-number rows -->
  <rect id="master-bg" width="1280" height="720" fill="#F5F3EF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="master-top-rule" x="48" y="44" width="1184" height="3" fill="#0B2545" data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="master-footer-rule" x1="48" y1="672" x2="1232" y2="672" stroke="#B8B8B8" stroke-width="1" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-summary-sidebar" x="48" y="128" width="368" height="524" fill="#E3E8EF" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-main-top-rule" x="448" y="128" width="784" height="2" fill="#0B2545" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="report-header">
    <text x="48" y="33" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#707070" xml:space="preserve"><tspan font-weight="700" fill="#0B2545">{{BRAND_MARK}}</tspan><tspan fill="#B8B8B8">  |  </tspan><tspan>{{REPORT_TYPE}}</tspan></text>
    <text x="1232" y="33" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#707070" xml:space="preserve"><tspan>{{DATE}}</tspan><tspan fill="#B8B8B8">  ·  </tspan><tspan>{{CLASSIFICATION}}</tspan></text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="48 64 1184 44">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="48" y="96" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="30" letter-spacing="-0.4" fill="#1A1A1A">{{TITLE}}</text>
  </g>

  <g id="takeaway-list">
    <text x="72" y="166" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="18" fill="#0B2545">핵심 요약</text>
    <text x="392" y="166" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#707070">Key Takeaways</text>
    <rect x="72" y="182" width="320" height="2" fill="#0B2545"/>
    <text x="72" y="226" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#0B2545">01</text>
    <text x="104" y="226" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#1A1A1A">{{TAKEAWAY_1}}</text>
    <text x="104" y="254" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#707070">{{TAKEAWAY_1_NOTE}}</text>
    <line x1="72" y1="298" x2="392" y2="298" stroke="#B8B8B8" stroke-width="1"/>
    <text x="72" y="340" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#0B2545">02</text>
    <text x="104" y="340" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#1A1A1A">{{TAKEAWAY_2}}</text>
    <text x="104" y="368" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#707070">{{TAKEAWAY_2_NOTE}}</text>
    <line x1="72" y1="412" x2="392" y2="412" stroke="#B8B8B8" stroke-width="1"/>
    <text x="72" y="454" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#0B2545">03</text>
    <text x="104" y="454" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#1A1A1A">{{TAKEAWAY_3}}</text>
    <text x="104" y="482" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#707070">{{TAKEAWAY_3_NOTE}}</text>
    <line x1="72" y1="526" x2="392" y2="526" stroke="#B8B8B8" stroke-width="1"/>
    <text x="72" y="568" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#0B2545">04</text>
    <text x="104" y="568" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#1A1A1A">{{TAKEAWAY_4}}</text>
    <text x="104" y="596" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#707070">{{TAKEAWAY_4_NOTE}}</text>
  </g>

  <g id="key-number-1">
    <text x="448" y="214" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="40" letter-spacing="-0.6" fill="#0B2545">{{KEY_1_NUM}}</text>
    <text x="448" y="246" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#3A3A3A">{{KEY_1_LABEL}}</text>
    <line x1="800" y1="170" x2="800" y2="264" stroke="#DCDCDC" stroke-width="1"/>
    <text x="832" y="202" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#3A3A3A">{{KEY_1_COMMENT}}</text>
    <line x1="448" y1="304" x2="1232" y2="304" stroke="#DCDCDC" stroke-width="1"/>
  </g>

  <g id="key-number-2">
    <text x="448" y="388" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="40" letter-spacing="-0.6" fill="#0B2545">{{KEY_2_NUM}}</text>
    <text x="448" y="420" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#3A3A3A">{{KEY_2_LABEL}}</text>
    <line x1="800" y1="344" x2="800" y2="438" stroke="#DCDCDC" stroke-width="1"/>
    <text x="832" y="376" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#3A3A3A">{{KEY_2_COMMENT}}</text>
    <line x1="448" y1="478" x2="1232" y2="478" stroke="#DCDCDC" stroke-width="1"/>
  </g>

  <g id="key-number-3">
    <text x="448" y="562" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="40" letter-spacing="-0.6" fill="#0B2545">{{KEY_3_NUM}}</text>
    <text x="448" y="594" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#3A3A3A">{{KEY_3_LABEL}}</text>
    <line x1="800" y1="518" x2="800" y2="612" stroke="#DCDCDC" stroke-width="1"/>
    <text x="832" y="550" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#3A3A3A">{{KEY_3_COMMENT}}</text>
  </g>

  <g id="disclaimer-slot" data-pptx-placeholder="footer" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="48 680 960 24">
    <text id="disclaimer-carrier" data-pptx-placeholder-carrier="true" x="48" y="695" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" fill="#707070">{{DISCLAIMER}}</text>
  </g>

  <g id="page-number-slot" data-pptx-placeholder="slide-number" data-pptx-placeholder-idx="3" data-pptx-placeholder-bounds="1112 680 120 24">
    <text id="page-number-carrier" data-pptx-placeholder-carrier="true" x="1232" y="695" text-anchor="end" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#1A1A1A">{{PAGE_NUM}}</text>
  </g>
</svg>
