<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="rn-master" data-pptx-master-name="Research Note" data-pptx-layout="rn_section" data-pptx-layout-name="Section Divider">
  <!-- Research Note — 03 Section: big navy number, 6px navy rule, title + description, section contents -->
  <rect id="master-bg" width="1280" height="720" fill="#F5F3EF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="master-top-rule" x="48" y="44" width="1184" height="3" fill="#0B2545" data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="master-footer-rule" x1="48" y1="672" x2="1232" y2="672" stroke="#B8B8B8" stroke-width="1" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-section-rule" x="48" y="392" width="1184" height="6" fill="#0B2545" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="report-header">
    <text x="48" y="33" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#707070" xml:space="preserve"><tspan font-weight="700" fill="#0B2545">{{BRAND_MARK}}</tspan><tspan fill="#B8B8B8">  |  </tspan><tspan>{{REPORT_TYPE}}</tspan></text>
    <text x="1232" y="33" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#707070" xml:space="preserve"><tspan>{{DATE}}</tspan><tspan fill="#B8B8B8">  ·  </tspan><tspan>{{CLASSIFICATION}}</tspan></text>
  </g>

  <g id="section-number">
    <text x="48" y="236" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" letter-spacing="1.5" fill="#707070">SECTION</text>
    <text x="42" y="362" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="132" letter-spacing="-4" fill="#0B2545">{{CHAPTER_NUM}}</text>
  </g>

  <g id="section-contents">
    <text x="872" y="442" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#707070">이 섹션의 내용</text>
    <line x1="872" y1="454" x2="1232" y2="454" stroke="#B8B8B8" stroke-width="1"/>
    <text x="872" y="486" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="15" fill="#0B2545">1</text>
    <text x="896" y="486" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">{{SECTION_ITEM_1}}</text>
    <text x="872" y="520" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="15" fill="#0B2545">2</text>
    <text x="896" y="520" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">{{SECTION_ITEM_2}}</text>
    <text x="872" y="554" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="15" fill="#0B2545">3</text>
    <text x="896" y="554" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">{{SECTION_ITEM_3}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="48 416 792 64">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="48" y="462" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="44" letter-spacing="-0.7" fill="#1A1A1A">{{CHAPTER_TITLE}}</text>
  </g>

  <g id="section-desc">
    <text x="48" y="508" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" fill="#3A3A3A">{{CHAPTER_DESC}}</text>
  </g>

  <g id="disclaimer-slot" data-pptx-placeholder="footer" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="48 680 960 24">
    <text id="disclaimer-carrier" data-pptx-placeholder-carrier="true" x="48" y="695" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" fill="#707070">{{DISCLAIMER}}</text>
  </g>

  <g id="page-number-slot" data-pptx-placeholder="slide-number" data-pptx-placeholder-idx="3" data-pptx-placeholder-bounds="1112 680 120 24">
    <text id="page-number-carrier" data-pptx-placeholder-carrier="true" x="1232" y="695" text-anchor="end" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#1A1A1A">{{PAGE_NUM}}</text>
  </g>
</svg>
