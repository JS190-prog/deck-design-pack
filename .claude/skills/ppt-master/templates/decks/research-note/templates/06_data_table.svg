  <rect id="layout-table-panel" x="48" y="190" width="1184" height="378" fill="#FFFFFF" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-table-top-rule" x="48" y="190" width="1184" height="2" fill="#0B2545" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="report-header">
