<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="pop-master" data-pptx-master-name="Pop Brutal" data-pptx-layout="09_quote" data-pptx-layout-name="Quote Bubble">
  <!-- Pop Brutal — 09 Quote: outlined speech bubble with polygon tail -->
  <rect id="master-bg" width="1280" height="720" fill="#FFF6E0" data-pptx-layer="master" data-pptx-editable="false"/>
  <path id="layout-bubble-shadow" d="M80 104 H1104 Q1120 104 1120 120 V424 Q1120 440 1104 440 H256 L136 524 L168 440 H80 Q64 440 64 424 V120 Q64 104 80 104 Z" transform="translate(8 8)" fill="#111111" data-pptx-layer="layout" data-pptx-editable="false"/>

  <path id="layout-bubble" d="M80 104 H1104 Q1120 104 1120 120 V424 Q1120 440 1104 440 H256 L136 524 L168 440 H80 Q64 440 64 424 V120 Q64 104 80 104 Z" fill="#3D5AFE" stroke="#111111" stroke-width="3" stroke-linejoin="round" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="quote-badge">
    <circle cx="112" cy="116" r="40" fill="#111111"/>
    <circle cx="104" cy="108" r="40" fill="#FFD23F" stroke="#111111" stroke-width="3"/>
    <text x="104" y="156" text-anchor="middle" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="96" fill="#111111">“</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="112 176 960 216">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="112" y="236" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="52" letter-spacing="-1" fill="#FFFFFF">{{QUOTE}}</text>
  </g>

  <g id="quote-sticker" transform="rotate(5 1048 104)">
    <rect x="964" y="88" width="184" height="48" rx="16" fill="#111111"/>
    <rect x="956" y="80" width="184" height="48" rx="16" fill="#FF5C8A" stroke="#111111" stroke-width="3"/>
    <text x="1048" y="110.5" text-anchor="middle" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="18" letter-spacing="0.5" fill="#111111">{{STICKER}}</text>
  </g>

  <g id="quote-attribution">
    <circle cx="192" cy="592" r="36" fill="#111111"/>
    <circle cx="184" cy="584" r="36" fill="#2EC4B6" stroke="#111111" stroke-width="3"/>
    <text x="240" y="578" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="26" letter-spacing="-0.3" fill="#111111">{{QUOTE_AUTHOR}}</text>
    <text x="240" y="608" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#111111">{{QUOTE_ROLE}}</text>
  </g>

  <g id="page-foot">
    <text x="64" y="684" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="0.5" fill="#111111">{{BRAND_MARK}}</text>
    <text x="1216" y="684" text-anchor="end" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="0.5" fill="#111111">{{PAGE_LABEL}}</text>
  </g>
</svg>
