<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="pop-master" data-pptx-master-name="Pop Brutal" data-pptx-layout="06_big_number" data-pptx-layout-name="Big Number">
  <!-- Pop Brutal — 06 Big number: 220px stat on a yellow block + 2 mini blocks -->
  <rect id="master-bg" width="1280" height="720" fill="#FFF6E0" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-stat-shadow" x="72" y="216" width="704" height="384" fill="#111111" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-stat-block" x="64" y="208" width="704" height="384" fill="#FFD23F" stroke="#111111" stroke-width="3" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="64 60 920 84">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="64" y="124" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="52" letter-spacing="-1" fill="#111111">{{TITLE}}</text>
  </g>

  <g id="page-lead">
    <text x="64" y="174" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="22" fill="#111111">{{LEAD}}</text>
  </g>

  <g id="stat-hero">
    <text x="104" y="440" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="220" letter-spacing="-6" fill="#111111">87%</text>
    <text x="104" y="528" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="26" letter-spacing="-0.3" fill="#111111">{{BIG_LABEL}}</text>
  </g>

  <g id="stat-sticker" transform="rotate(-5 712 212)">
    <rect x="628" y="196" width="184" height="48" rx="16" fill="#111111"/>
    <rect x="620" y="188" width="184" height="48" rx="16" fill="#2EC4B6" stroke="#111111" stroke-width="3"/>
    <text x="712" y="218.5" text-anchor="middle" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="18" letter-spacing="0.5" fill="#111111">{{STICKER}}</text>
  </g>

  <g id="stat-mini-1">
    <rect x="824" y="216" width="400" height="176" rx="16" fill="#111111"/>
    <rect x="816" y="208" width="400" height="176" rx="16" fill="#FF5C8A" stroke="#111111" stroke-width="3"/>
    <text x="848" y="294" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="56" letter-spacing="-2" fill="#111111">{{STAT_1}}</text>
    <text x="848" y="344" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="20" fill="#111111">{{STAT_1_LABEL}}</text>
  </g>

  <g id="stat-mini-2">
    <rect x="824" y="424" width="400" height="176" rx="16" fill="#111111"/>
    <rect x="816" y="416" width="400" height="176" rx="16" fill="#3D5AFE" stroke="#111111" stroke-width="3"/>
    <text x="848" y="502" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="56" letter-spacing="-2" fill="#FFFFFF">{{STAT_2}}</text>
    <text x="848" y="552" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="20" fill="#FFFFFF">{{STAT_2_LABEL}}</text>
  </g>

  <g id="page-foot">
    <text x="64" y="684" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="0.5" fill="#111111">{{BRAND_MARK}}</text>
    <text x="1216" y="684" text-anchor="end" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="0.5" fill="#111111">{{PAGE_LABEL}}</text>
  </g>
</svg>
