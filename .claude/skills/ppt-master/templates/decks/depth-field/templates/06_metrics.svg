<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="depth-master" data-pptx-master-name="Depth Field" data-pptx-layout="06_metrics" data-pptx-layout-name="Metrics (4-up)">
  <!-- Depth Field — 06 Metrics: four flat panels; only the lead metric glows; depth bars recede left→right -->
  <defs>
    <filter id="metric-lead-glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#5CE1E6" flood-opacity="0.5" result="tint"/>
      <feComposite in="tint" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="master-bg" width="1280" height="720" fill="#060B1A" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-metric-panel-1" x="80" y="236" width="262" height="320" rx="6" fill="#0E1630" stroke="#1E2A4A" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-metric-panel-2" x="366" y="236" width="262" height="320" rx="6" fill="#0E1630" stroke="#1E2A4A" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-metric-panel-3" x="652" y="236" width="262" height="320" rx="6" fill="#0E1630" stroke="#1E2A4A" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-metric-panel-4" x="938" y="236" width="262" height="320" rx="6" fill="#0E1630" stroke="#1E2A4A" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="80 112 1120 56">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="80" y="152" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="40" letter-spacing="-0.6" fill="#EAF0FF">{{TITLE}}</text>
  </g>

  <g id="page-header">
    <text x="80" y="96" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="1.5" fill="#5CE1E6">{{DEPTH_TAG}}<tspan fill="#6F7BA0"> · {{KICKER}}</tspan></text>
    <text x="80" y="196" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#AEB9D6">{{LEAD}}</text>
  </g>

  <g id="metric-1">
    <text x="104" y="274" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="1.5" fill="#5CE1E6">Z-01</text>
    <text x="104" y="368" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="52" letter-spacing="-1" fill="#5CE1E6" filter="url(#metric-lead-glow)">{{METRIC_1_VALUE}}</text>
    <text x="104" y="410" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#AEB9D6">{{METRIC_1_LABEL}}</text>
    <rect x="104" y="470" width="214" height="4" rx="2" fill="#1E2A4A"/>
    <rect x="104" y="470" width="182" height="4" rx="2" fill="#5CE1E6"/>
    <text x="104" y="514" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#6F7BA0">{{METRIC_1_DELTA}}</text>
  </g>

  <g id="metric-2">
    <text x="390" y="274" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="1.5" fill="#6F7BA0">Z-02</text>
    <text x="390" y="368" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="52" letter-spacing="-1" fill="#EAF0FF">{{METRIC_2_VALUE}}</text>
    <text x="390" y="410" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#AEB9D6">{{METRIC_2_LABEL}}</text>
    <rect x="390" y="470" width="214" height="4" rx="2" fill="#1E2A4A"/>
    <rect x="390" y="470" width="150" height="4" rx="2" fill="#8B7CFF"/>
    <text x="390" y="514" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#6F7BA0">{{METRIC_2_DELTA}}</text>
  </g>

  <g id="metric-3">
    <text x="676" y="274" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="1.5" fill="#6F7BA0">Z-03</text>
    <text x="676" y="368" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="52" letter-spacing="-1" fill="#EAF0FF">{{METRIC_3_VALUE}}</text>
    <text x="676" y="410" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#AEB9D6">{{METRIC_3_LABEL}}</text>
    <rect x="676" y="470" width="214" height="4" rx="2" fill="#1E2A4A"/>
    <rect x="676" y="470" width="118" height="4" rx="2" fill="#8B7CFF"/>
    <text x="676" y="514" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#6F7BA0">{{METRIC_3_DELTA}}</text>
  </g>

  <g id="metric-4">
    <text x="962" y="274" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="1.5" fill="#6F7BA0">Z-04</text>
    <text x="962" y="368" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="52" letter-spacing="-1" fill="#EAF0FF">{{METRIC_4_VALUE}}</text>
    <text x="962" y="410" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#AEB9D6">{{METRIC_4_LABEL}}</text>
    <rect x="962" y="470" width="214" height="4" rx="2" fill="#1E2A4A"/>
    <rect x="962" y="470" width="86" height="4" rx="2" fill="#6F7BA0"/>
    <text x="962" y="514" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#6F7BA0">{{METRIC_4_DELTA}}</text>
  </g>

  <g id="page-foot">
    <text x="80" y="600" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#6F7BA0">{{SOURCE}}</text>
    <text x="80" y="676" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#6F7BA0">{{BRAND_MARK}}</text>
    <text x="1200" y="676" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#6F7BA0">{{PAGE_LABEL}}</text>
  </g>
</svg>
