<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="scroll-rail-master" data-pptx-master-name="Scroll Rail" data-pptx-layout="08_zoom_dive" data-pptx-layout-name="Zoom Dive">
  <!-- Scroll Rail — 08 Zoom dive: nested frames anchored at (80,256); inner frame hands off to 09 word door -->
  <rect id="master-bg" width="1280" height="720" fill="#FAFAF7" data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="master-rail" x1="80" y1="628" x2="1200" y2="628" stroke="#D5D8DE" stroke-width="2" data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="master-rail-start" x1="80" y1="621" x2="80" y2="635" stroke="#8A8F98" stroke-width="2" data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="master-rail-end" x1="1200" y1="621" x2="1200" y2="635" stroke="#8A8F98" stroke-width="2" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-frame-whole" x="80" y="256" width="1120" height="336" fill="none" stroke="#D5D8DE" stroke-width="1.5" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-frame-mid" x="80" y="256" width="720" height="232" fill="none" stroke="#8A8F98" stroke-width="1.5" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-frame-part" x="80" y="256" width="400" height="128" fill="#FF4F2E" fill-opacity="0.08" stroke="#FF4F2E" stroke-width="2" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="80 96 1120 64">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="80" y="144" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="40" letter-spacing="-0.8" fill="#14161A">{{TITLE}}</text>
  </g>

  <g id="support-slot" data-pptx-placeholder="body" data-pptx-placeholder-idx="1" data-pptx-placeholder-bounds="80 164 1120 44">
    <text id="support-carrier" data-pptx-placeholder-carrier="true" x="80" y="192" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" fill="#3C4048">{{SUPPORT}}</text>
  </g>

  <!-- part — value on anchor line A -->
  <g id="level-part">
    <text x="104" y="290" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#3C4048">{{PART_NAME}}</text>
    <text x="104" y="352" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="44" letter-spacing="-0.8" fill="#FF4F2E">{{PART_VALUE}}</text>
  </g>

  <g id="level-mid">
    <text x="104" y="420" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#8A8F98">{{MID_NAME}}</text>
    <text x="104" y="462" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="30" letter-spacing="-0.4" fill="#14161A">{{MID_VALUE}}</text>
  </g>

  <g id="level-whole">
    <text x="104" y="528" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#8A8F98">{{WHOLE_NAME}}</text>
    <text x="104" y="570" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="30" letter-spacing="-0.4" fill="#3C4048">{{WHOLE_VALUE}}</text>
  </g>

  <g id="claim-source">
    <text x="1200" y="690" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" fill="#8A8F98">{{SOURCE}}</text>
  </g>

  <!-- stop marker — page 8 of 10: x = 80 + 1120 × (8−1)/(10−1) = 951 -->
  <g id="rail-marker">
    <line x1="80" y1="628" x2="951" y2="628" stroke="#14161A" stroke-width="2"/>
    <circle cx="951" cy="628" r="12" fill="#FF4F2E" fill-opacity="0.16"/>
    <circle cx="951" cy="628" r="6" fill="#FF4F2E"/>
    <text x="951" y="658" text-anchor="middle" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" letter-spacing="0.4" fill="#14161A">{{STOP_LABEL}}</text>
  </g>

  <g id="page-foot">
    <text x="80" y="690" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#8A8F98">{{BRAND_MARK}}</text>
  </g>
</svg>
