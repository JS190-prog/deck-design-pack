    <text x="980" y="132" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="56" letter-spacing="-1.2" fill="#7A80A3">02</text>
    <text x="980" y="268" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="26" letter-spacing="-0.3" fill="#F4F6FF">{{TOC_ITEM_2_TITLE}}</text>
