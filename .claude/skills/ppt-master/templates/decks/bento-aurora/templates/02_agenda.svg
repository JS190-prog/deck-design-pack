    <text x="972" y="578" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="24" letter-spacing="-0.3" fill="#F4F6FF">{{TOC_ITEM_5_TITLE}}</text>
