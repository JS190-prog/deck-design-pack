    <circle cx="984" cy="418" r="3" fill="#B3B8D4"/>
    <text x="998" y="424" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" letter-spacing="-0.1" fill="#B3B8D4">{{PHASE_3_ITEM_1}}</text>
    <circle cx="984" cy="466" r="3" fill="#B3B8D4"/>
    <text x="998" y="472" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" letter-spacing="-0.1" fill="#B3B8D4">{{PHASE_3_ITEM_2}}</text>
