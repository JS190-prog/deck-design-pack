<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="bento-aurora-master" data-pptx-master-name="Bento Aurora" data-pptx-layout="08_roadmap" data-pptx-layout-name="Roadmap (Now Next Later)">
  <!-- Bento Aurora — 08 Roadmap: glowing aurora rail with milestone dots over narrowing NOW / NEXT / LATER tiles -->
  <defs>
    <radialGradient id="aurViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#7C5CFF" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.66"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.68"/>
      <stop offset="45%" stop-color="#F472B6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="railFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="aurWash" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect id="master-bg" width="1280" height="720" fill="#07080F" data-pptx-layer="master" data-pptx-editable="false"/>

  <rect id="layout-rail-halo" x="48" y="168" width="1184" height="16" rx="8" fill="url(#railFlow)" fill-opacity="0.2" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-rail-core" x="48" y="174" width="1184" height="4" rx="2" fill="url(#railFlow)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-hero-tile" x="48" y="208" width="484" height="448" rx="24" fill="#161A29" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-hero-wash" x="48" y="208" width="484" height="448" rx="24" fill="url(#aurWash)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-violet" cx="360" cy="310" rx="160" ry="70" transform="rotate(-24 360 310)" fill="url(#aurViolet)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-pink" cx="420" cy="266" rx="90" ry="36" transform="rotate(-24 420 266)" fill="url(#aurPink)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-cyan" cx="300" cy="370" rx="130" ry="40" transform="rotate(-24 300 370)" fill="url(#aurCyan)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-hero-rim" x="48" y="208" width="484" height="448" rx="24" fill="none" stroke="url(#aurRim)" stroke-width="1.5" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-tile-next" x="548" y="208" width="384" height="448" rx="24" fill="#10121C" stroke="#262B40" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-tile-later" x="948" y="208" width="284" height="448" rx="24" fill="#10121C" stroke="#262B40" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="page-kicker">
    <rect x="48" y="40" width="176" height="28" rx="14" fill="#161A29" stroke="#262B40" stroke-width="1"/>
    <circle cx="64" cy="54" r="4" fill="#7C5CFF"/>
