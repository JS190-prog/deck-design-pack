<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="bento-aurora-master" data-pptx-master-name="Bento Aurora" data-pptx-layout="03_section" data-pptx-layout-name="Section (Aurora Numeral)">
  <!-- Bento Aurora — 03 Section: aurora field, hero tile with a giant glowing chapter numeral -->
  <defs>
    <radialGradient id="fieldViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.62"/>
      <stop offset="50%" stop-color="#7C5CFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#7C5CFF" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.66"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.68"/>
      <stop offset="45%" stop-color="#F472B6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="numeralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7C5CFF" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="aurWash" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect id="master-bg" width="1280" height="720" fill="#07080F" data-pptx-layer="master" data-pptx-editable="false"/>

  <ellipse id="layout-field-violet" cx="320" cy="400" rx="560" ry="440" fill="url(#fieldViolet)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-field-cyan" cx="1210" cy="70" rx="360" ry="250" fill="url(#fieldCyan)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-field-pink" cx="1000" cy="730" rx="440" ry="250" fill="url(#fieldPink)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-hero-tile" x="48" y="48" width="484" height="608" rx="24" fill="#161A29" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-hero-wash" x="48" y="48" width="484" height="608" rx="24" fill="url(#aurWash)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-violet" cx="300" cy="300" rx="230" ry="140" transform="rotate(-30 300 300)" fill="url(#aurViolet)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-pink" cx="360" cy="180" rx="150" ry="70" transform="rotate(-30 360 180)" fill="url(#aurPink)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-cyan" cx="230" cy="430" rx="170" ry="80" transform="rotate(-30 230 430)" fill="url(#aurCyan)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-hero-rim" x="48" y="48" width="484" height="608" rx="24" fill="none" stroke="url(#aurRim)" stroke-width="1.5" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-tile-chapter" x="548" y="48" width="684" height="608" rx="24" fill="#10121C" fill-opacity="0.78" stroke="#262B40" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="section-numeral">
    <text x="76" y="620" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="180" letter-spacing="-6" fill="#F4F6FF" filter="url(#numeralGlow)">{{CHAPTER_NUM}}</text>
  </g>

  <g id="section-kicker">
    <rect x="588" y="88" width="176" height="32" rx="16" fill="#161A29" stroke="#262B40" stroke-width="1"/>
    <circle cx="606" cy="104" r="4" fill="#7C5CFF"/>
    <text x="620" y="109" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" letter-spacing="1.2" fill="#B3B8D4">{{KICKER}}</text>
  </g>

  <g id="section-progress">
    <rect x="976" y="101" width="40" height="6" rx="3" fill="#7C5CFF"/>
    <rect x="1024" y="101" width="40" height="6" rx="3" fill="#262B40"/>
    <rect x="1072" y="101" width="40" height="6" rx="3" fill="#262B40"/>
    <rect x="1120" y="101" width="40" height="6" rx="3" fill="#262B40"/>
    <rect x="1168" y="101" width="24" height="6" rx="3" fill="#262B40"/>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="588 452 604 80">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="588" y="512" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="54" letter-spacing="-1.2" fill="#F4F6FF">{{CHAPTER_TITLE}}</text>
  </g>

  <g id="section-desc">
    <text x="588" y="566" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#B3B8D4">{{CHAPTER_DESC}}</text>
  </g>

  <g id="page-foot">
    <text x="48" y="692" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#7A80A3">{{BRAND_MARK}}</text>
    <text x="1232" y="692" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#7A80A3">{{PAGE_LABEL}}</text>
  </g>
</svg>
