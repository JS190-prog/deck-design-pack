<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="bento-aurora-master" data-pptx-master-name="Bento Aurora" data-pptx-layout="01_cover" data-pptx-layout-name="Cover (Aurora Field)">
  <!-- Bento Aurora — 01 Cover: aurora field, massive title, bento meta row with one aurora hero tile -->
  <defs>
    <radialGradient id="fieldViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.62"/>
      <stop offset="50%" stop-color="#7C5CFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#7C5CFF" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.66"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.68"/>
      <stop offset="45%" stop-color="#F472B6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="aurWash" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect id="master-bg" width="1280" height="720" fill="#07080F" data-pptx-layer="master" data-pptx-editable="false"/>

  <ellipse id="layout-field-violet" cx="1000" cy="230" rx="600" ry="420" fill="url(#fieldViolet)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-field-pink" cx="700" cy="40" rx="440" ry="250" fill="url(#fieldPink)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-field-cyan" cx="1230" cy="520" rx="400" ry="300" fill="url(#fieldCyan)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-tile-date" x="48" y="504" width="284" height="152" rx="24" fill="#10121C" fill-opacity="0.78" stroke="#262B40" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-tile-presenter" x="348" y="504" width="384" height="152" rx="24" fill="#10121C" fill-opacity="0.78" stroke="#262B40" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-hero-tile" x="748" y="504" width="484" height="152" rx="24" fill="#161A29" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-hero-wash" x="748" y="504" width="484" height="152" rx="24" fill="url(#aurWash)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-violet" cx="1020" cy="580" rx="200" ry="52" transform="rotate(-12 1020 580)" fill="url(#aurViolet)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-pink" cx="1130" cy="556" rx="90" ry="34" transform="rotate(-12 1130 556)" fill="url(#aurPink)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-cyan" cx="930" cy="606" rx="130" ry="34" transform="rotate(-12 930 606)" fill="url(#aurCyan)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-hero-rim" x="748" y="504" width="484" height="152" rx="24" fill="none" stroke="url(#aurRim)" stroke-width="1.5" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="cover-kicker">
    <rect x="48" y="176" width="176" height="32" rx="16" fill="#161A29" stroke="#262B40" stroke-width="1"/>
    <circle cx="66" cy="192" r="4" fill="#7C5CFF"/>
    <text x="80" y="197" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" letter-spacing="1.2" fill="#B3B8D4">{{KICKER}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="48 236 1184 108">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="48" y="316" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="88" letter-spacing="-1.8" fill="#F4F6FF">{{TITLE}}</text>
  </g>

  <g id="subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="48 352 900 44">
    <text id="subtitle-carrier" data-pptx-placeholder-carrier="true" x="48" y="384" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" letter-spacing="-0.3" fill="#B3B8D4">{{SUBTITLE}}</text>
  </g>

  <g id="cover-date">
    <text x="80" y="548" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="12" letter-spacing="1.6" fill="#7A80A3">DATE</text>
    <text x="80" y="614" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="26" letter-spacing="-0.3" fill="#F4F6FF">{{DATE}}</text>
  </g>

  <g id="cover-presenter">
    <text x="380" y="548" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="12" letter-spacing="1.6" fill="#7A80A3">PRESENTED BY</text>
    <text x="380" y="614" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="26" letter-spacing="-0.3" fill="#F4F6FF">{{PRESENTER}}</text>
  </g>

  <g id="cover-brand">
    <text x="780" y="614" font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="30" letter-spacing="-0.4" fill="#F4F6FF">{{BRAND_MARK}}</text>
    <circle cx="1176" cy="560" r="24" fill="#F4F6FF" fill-opacity="0.12" stroke="#F4F6FF" stroke-opacity="0.4" stroke-width="1"/>
    <text x="1176" y="568" text-anchor="middle" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="22" fill="#F4F6FF">→</text>
  </g>
