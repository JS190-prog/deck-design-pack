  <ellipse id="layout-hero-aurora-violet" cx="290" cy="236" rx="130" ry="60" transform="rotate(-20 290 236)" fill="url(#aurViolet)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="layout-hero-aurora-pink" cx="350" cy="200" rx="70" ry="34" transform="rotate(-20 350 200)" fill="url(#aurPink)" data-pptx-layer="layout" data-pptx-editable="false"/>
